name: Build Flux module
description: Builds fluxd, the WebUI and the flashable zip (shared by CI and releases)

outputs:
  zip-name:
    description: File name of the flashable zip in the workspace root
    value: ${{ steps.zip.outputs.zipName }}
  zip-arm64:
    description: File name of the 64-bit (arm64-v8a) zip
    value: ${{ steps.zip.outputs.zipArm64 }}
  zip-arm:
    description: File name of the 32-bit (armeabi-v7a) zip
    value: ${{ steps.zip.outputs.zipArm }}
  zips:
    description: All flashable zips (arm64, arm, universal), one per line
    value: ${{ steps.zip.outputs.zips }}

runs:
  using: composite
  steps:
    - name: NDK Setup
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29

    - name: Bun Setup
      uses: oven-sh/setup-bun@v2

    - name: Build Flux Daemon
      shell: bash
      run: ndk-build -j"$(nproc --all)"

    - name: Build WebUI
      shell: bash
      working-directory: webui
      run: |
        bun install --frozen-lockfile
        bun run build
        cp -r ./dist/* ../module/webroot

    - name: Compile Flashable Zip
      id: zip
      shell: bash
      run: bash .github/scripts/compile_zip.sh
