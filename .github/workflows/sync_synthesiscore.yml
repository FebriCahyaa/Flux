name: Sync SynthesisCore

# Pulls the latest signed SynthesisCore release into prebuilt/ after verifying
# its checksum, pinned signing certificate (prebuilt/synthesiscore.cert.sha256)
# and build provenance attestation, and opens a pull request.
#
# Triggers: daily, manually, or instantly via repository_dispatch
# ("synthesiscore-release", sent by the SynthesisCore release workflow).
#
# Optional configuration (Settings → Secrets and variables → Actions):
#   vars.SYNTHESISCORE_CERT_SHA256  overrides the committed pin (key rotation)
#   vars.SYNTHESISCORE_REPOSITORY   default FebriCahyaa/SynthesisCore
#   vars.VERIFY_ATTESTATION         "false" to skip the attestation check
#   secrets.SYNTHESISCORE_TOKEN     read token, only if SynthesisCore becomes private

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync, e.g. v2.1.0 (empty or "latest" = newest release)'
        required: false
  repository_dispatch:
    types: [synthesiscore-release]

concurrency:
  group: sync-synthesiscore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Verify & Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the sync branch
      pull-requests: write   # open the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and verify release
        id: sync
        env:
          SOURCE_REPO: ${{ vars.SYNTHESISCORE_REPOSITORY || 'FebriCahyaa/SynthesisCore' }}
          SYNTHESISCORE_CERT_SHA256: ${{ vars.SYNTHESISCORE_CERT_SHA256 }}
          VERIFY_ATTESTATION: ${{ vars.VERIFY_ATTESTATION }}
          REQUESTED_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          GH_TOKEN: ${{ secrets.SYNTHESISCORE_TOKEN || github.token }}
        run: bash .github/scripts/sync_synthesiscore.sh

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          SHA256: ${{ steps.sync.outputs.sha256 }}
          SOURCE_REPO: ${{ vars.SYNTHESISCORE_REPOSITORY || 'FebriCahyaa/SynthesisCore' }}
        run: |
          set -euo pipefail
          branch="sync/synthesiscore-$TAG"
          base="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add prebuilt/synthesiscore.apk prebuilt/synthesiscore.apk.sha256 prebuilt/synthesiscore.json
          git commit -m "chore(prebuilt): sync SynthesisCore $TAG" -m "SHA-256: $SHA256"
          git push --force-with-lease origin "$branch"

          if [[ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            echo "Pull request for $branch already open; branch updated"
            exit 0
          fi

          body=$(cat <<EOF
          Syncs \`prebuilt/synthesiscore.apk\` to [SynthesisCore $TAG]($GITHUB_SERVER_URL/$SOURCE_REPO/releases/tag/$TAG).

          Verified by the sync workflow before this commit:
          - [x] SHA-256 matches the published checksum: \`$SHA256\`
          - [x] Signed by exactly one certificate, matching \`prebuilt/synthesiscore.cert.sha256\`
          - [x] Build provenance attestation verified (unless disabled with \`VERIFY_ATTESTATION=false\`)

          See the release notes for the changelog.
          EOF
          )
          if ! gh pr create --base "$base" --head "$branch" \
            --title "chore(prebuilt): sync SynthesisCore $TAG" \
            --body "$body"; then
            # Usually "GitHub Actions is not permitted to create or approve pull
            # requests" (Settings → Actions → General). The verified branch is
            # pushed, so hand over a one-click link instead of failing.
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$base...$branch?expand=1"
            echo "::warning::Could not open the pull request automatically. Open it here: $compare"
            {
              echo "### Verified SynthesisCore $TAG is ready"
              echo
              echo "The APK passed all checks and was pushed to \`$branch\`, but GitHub Actions"
              echo "is not allowed to open pull requests in this repository."
              echo
              echo "**[Open the pull request]($compare)**, or allow it once under"
              echo "*Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
