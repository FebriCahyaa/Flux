name: Build Flux Tweaks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - 'java/**'
      - 'jni/**'
      - 'scripts/**'
      - 'module/**'
      - 'prebuilt/**'
      - 'webui/**'
      - 'gamelist.txt'
      - 'version'

# Allow only one concurrent build workflows
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: Build Flashable Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Build module
        id: compileZip
        uses: ./.github/actions/build-module

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: flux-build
          path: ${{ steps.compileZip.outputs.zip-name }}

      - name: Upload To Telegram
        # Secrets cannot be tested in `if:` (a step's own env is not visible there
        # either), so the script skips itself when they are missing.
        if: always() && github.event_name != 'pull_request'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_DEV_ID: ${{ secrets.TELEGRAM_DEV_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Flux Tweaks
          JOB_STATUS: ${{ job.status }}
          ZIP_NAME: ${{ steps.compileZip.outputs.zip-name }}
        run: |
          export VERSION=$(git rev-list --count HEAD)
          bash .github/scripts/telegram_bot.sh "$ZIP_NAME" "$JOB_STATUS"
