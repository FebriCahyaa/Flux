  <rect x="104" y="188" width="44" height="78" rx="20" fill="#2b2842"/>
  <rect x="364" y="188" width="44" height="78" rx="20" fill="#2b2842"/>
  <rect x="112" y="200" width="10" height="54" rx="5" fill="#63f0ff"/>
  <rect x="390" y="200" width="10" height="54" rx="5" fill="#63f0ff"/>
