<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2aa8"/>
      <stop offset="0.55" stop-color="#6f5cff"/>
      <stop offset="1" stop-color="#63f0ff"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeeaff"/>
      <stop offset="1" stop-color="#d9d2ff"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c73ff"/>
      <stop offset="1" stop-color="#6a4cf5"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#ff8fb1" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8fb1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1240" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#soft)" transform="rotate(-8 256 300)">
