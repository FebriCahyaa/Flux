  <ellipse cx="190" cy="276" rx="26" ry="16" fill="url(#blush)"/>
  <ellipse cx="322" cy="276" rx="26" ry="16" fill="url(#blush)"/>
  <path d="M180,246 C192,262 224,262 236,246" fill="none" stroke="#2a1f5c"
