  <path d="M272,392 L276,440" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="236" cy="444" r="5" fill="#63f0ff"/>
  <circle cx="276" cy="444" r="5" fill="#63f0ff"/>
