plugins { id 'com.android.application' }

android {
    namespace 'dev.flux.compattest'
    compileSdk 34
    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    flavorDimensions 'role'
    productFlavors {
        appA  { dimension 'role'; applicationId 'dev.flux.compattest.a' }
        appB  { dimension 'role'; applicationId 'dev.flux.compattest.b' }
        plain { dimension 'role'; applicationId 'dev.flux.compattest.plain' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    buildTypes { release { minifyEnabled false } }
}
